services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: insights
      POSTGRES_USER: insights
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - insights-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insights -d insights"]
      interval: 3s
      timeout: 3s
      retries: 20
  ingest:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: insights
      PGUSER: insights
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    profiles: [tools]
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    ports:
      - "127.0.0.1:${ORCHESTRATOR_PORT:-8000}:8000"
    volumes:
      - ./data/processed:/app/data/processed:ro
volumes:
  insights-db:
