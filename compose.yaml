# One backend image (Dockerfile) for every Python service: torch and the other heavy dependencies are built once.
x-backend: &backend
  build:
    context: .
  image: alpha-insights-backend
  environment: &backend-env
    PGHOST: db
    PGPORT: 5432
    PGDATABASE: insights
    PGUSER: insights
    PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: insights
      POSTGRES_USER: insights
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - insights-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insights -d insights"]
      interval: 3s
      timeout: 3s
      retries: 20
  ingest:
    <<: *backend
    entrypoint: ["python", "-m", "ingestion"]
    volumes:
      - ./data:/app/data
    profiles: [tools]
  orchestrator:
    <<: *backend
    command: ["python", "-m", "orchestrator"]
    ports:
      - "127.0.0.1:${ORCHESTRATOR_PORT:-8000}:8000"
    environment:
      <<: *backend-env
      REPORTS_PATH: /app/data/raw/reports
      API_KEY: ${API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODELS_BANNER: ${LLM_MODELS_BANNER:-}
      LLM_MODELS_CHAT: ${LLM_MODELS_CHAT:-}
      LLM_MODE: ${LLM_MODE:-}
      DEMO_COMPANY_ID: ${DEMO_COMPANY_ID:-}
      NEWS_SEARCH_MODE: ${NEWS_SEARCH_MODE:-lexical}
      BANNER_SLO_S: ${BANNER_SLO_S:-3.5}
    volumes:
      - ./data/processed/company_tags.csv:/app/data/processed/company_tags.csv:ro
      - ${REPORTS_PATH:-./data/raw/reports}:/app/data/raw/reports:ro
      - banner-store:/app/data/cache
      - model-cache:/root/.cache/huggingface

volumes:
  insights-db:
  banner-store:
  model-cache:
